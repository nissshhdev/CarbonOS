# IBM Carbon Dark Scheme for Alacritty
[window]
padding = { x = 14, y = 14 }
decorations = "full"
opacity = 0.96
blur = true
title = "Carbon Terminal"

[font]
size = 11.0

[font.normal]
family = "IBM Plex Mono"
style = "Regular"

[font.bold]
family = "IBM Plex Mono"
style = "Bold"

[font.italic]
family = "IBM Plex Mono"
style = "Italic"

[colors.primary]
background = "#161616"
foreground = "#f4f4f4"

[colors.cursor]
text = "#161616"
cursor = "#0f62fe"

[colors.selection]
text = "#ffffff"
background = "#0043ce"

[colors.normal]
black   = "#262626"
red     = "#fa4d56"
green   = "#42be65"
yellow  = "#f1c21b"
blue    = "#0f62fe"
magenta = "#a56eff"
cyan    = "#1192e8"
white   = "#f4f4f4"

[colors.bright]
black   = "#525252"
red     = "#ff8389"
green   = "#6fdc8c"
yellow  = "#fddc69"
blue    = "#4589ff"
magenta = "#be95ff"
cyan    = "#33b1ff"
white   = "#ffffff"

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500
