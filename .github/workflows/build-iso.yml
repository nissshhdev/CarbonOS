name: Build CarbonOS Bootable ISO

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare output directory
        run: |
          mkdir -p output
          echo "[+] Host workspace: $(pwd)"
          echo "[+] Output directory: $(pwd)/output"

      - name: Build CarbonOS ISO inside Arch Linux Container
        run: |
          docker run --privileged --rm \
            -v "$(pwd):/workspace" \
            -w /workspace \
            archlinux:base-devel bash -c "
              set -e

              echo '=== [1/5] Initializing pacman keyring ==='
              pacman-key --init
              pacman-key --populate archlinux

              echo '=== [2/5] Updating system and package mirrors ==='
              pacman -Syu --noconfirm

              echo '=== [3/5] Installing archiso and build dependencies ==='
              pacman -S --noconfirm \
                archiso \
                grub \
                syslinux \
                dosfstools \
                squashfs-tools \
                libisoburn \
                mtools \
                lynx \
                reflector \
                edk2-ovmf

              echo '=== [4/5] Making build script executable ==='
              chmod +x /workspace/build.sh

              echo '=== [5/5] Building CarbonOS ISO ==='
              OUTPUT_DIR=/workspace/output ARCHISO_PROFILE=/workspace/archiso-profile /workspace/build.sh

              echo '=== Container finished. Checking /workspace/output: ==='
              ls -lah /workspace/output/
            "

      - name: Verify ISO was generated
        run: |
          echo "=== Host output directory contents ==="
          ls -lah output/

          ISO_COUNT=$(ls output/*.iso 2>/dev/null | wc -l)
          if [ "$ISO_COUNT" -eq 0 ]; then
            echo "ERROR: No .iso file found in output directory!"
            exit 1
          fi

          ISO_FILE=$(ls output/*.iso | head -1)
          ISO_SIZE=$(du -sh "$ISO_FILE" | cut -f1)
          echo "=========================================="
          echo " [✓] SUCCESS: $ISO_FILE ($ISO_SIZE)"
          echo "=========================================="

      - name: Upload CarbonOS ISO Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CarbonOS-x86_64-ISO
          path: output/*.iso
          if-no-files-found: error
          retention-days: 14
